[package]
name = "asr"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
engine = { path = "../engine" }

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", features = ["metal"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
whisper-rs = "0.16"

[dev-dependencies]
hound = "3"
