[package]
name = "engine"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "time", "rt", "macros", "sync"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

# 只給測試用；這是相依套件的 bin，不會被打包進 app。
[[bin]]
name = "fake-claude"
path = "tests/fixtures/fake_claude.rs"
test = false
doc = false
